# nginx server block for id.africodeai.online
#
# Serves the static frontend from public_html and reverse-proxies the
# API endpoints (/generate, /validate) to the Kotlin/Ktor backend running
# on 127.0.0.1:8080.
#
# NOTE FOR HestiaCP/VestaCP USERS:
#   The panel regenerates the main per-domain vhost, so DON'T paste this
#   whole file over the managed config. Instead add just the "location"
#   blocks below into a custom template, e.g.:
#     /home/admin/conf/web/id.africodeai.online/nginx.conf_*
#   or use the panel's "Proxy Extensions". See deploy/README.md.
#
# This standalone version is for a plain (non-panel) nginx setup.

server {
    listen 80;
    listen [::]:80;
    server_name id.africodeai.online www.id.africodeai.online;

    # Redirect all HTTP to HTTPS (remove if you are not using TLS yet)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name id.africodeai.online www.id.africodeai.online;

    # Adjust these to your actual certificate paths.
    # HestiaCP default locations:
    ssl_certificate     /home/admin/conf/web/id.africodeai.online/ssl/id.africodeai.online.crt;
    ssl_certificate_key /home/admin/conf/web/id.africodeai.online/ssl/id.africodeai.online.key;

    root  /home/admin/web/id.africodeai.online/public_html;
    index index.html;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Kotlin backend
    location ~ ^/(generate|validate)$ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
